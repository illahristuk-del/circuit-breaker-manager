name: Microservice Resilience Platform CI/CD

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  code-quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linters and Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy bandit safety

      - name: Run Black (Formatting Check)
        run: black --check .

      - name: Run Isort (Imports Order)
        run: isort --check-only .

      - name: Run Flake8 (Syntax Style)
        run: flake8 --max-line-length=88 --exclude=.venv,lin-venv,.git

      - name: Run Mypy (Strict Type Checking)
        run: mypy --ignore-missing-imports .

      - name: Run Bandit (SAST - Code Vulnerability Scan)
        run: bandit -r . -ll -ii

      - name: Run Safety (SCA - Dependencies Vulnerability Scan)
        run: safety check

  testing:  
    needs: code-quality-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: Create Local Kubernetes Cluster (KinD)
        uses: engineerd/setup-kind@v0.5.0
        with:
          version: "v0.20.0"
      
      - name: Verify Cluster & Run Tests with Coverage (>85%)
        run: |
          kubectl cluster-info         
          pytest --cov=. --cov-report=term-missing --cov-fail-under=85 tests/
      
  build-and-publish:
    needs: testing
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Short Git SHA Tag
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up QEMU (Multi-architecture)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Local Image for Security Scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:test

      - name: Run Trivy Vulnerability Scanner (Security Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Install Cosign (Signing Tool)
        uses: sigstore/cosign-installer@v3.4.0

      - name: Build and Push Multi-Arch Image (amd64/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}:latest

      - name: Sign Published Docker Image
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          cosign sign --key cosign.key --yes ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha_short }}
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  deploy-staging:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Checkov (K8s Misconfiguration Scanner)
        run: pip install checkov

      - name: Scan K8s Manifests for Security Flaws
        run: checkov -d k8s/ --framework kubernetes

      - name: Set up Kubeconfig Access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBERNETES_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Staging Namespace & Rollout Smoke Test
        run: |
          kubectl apply -f k8s/ -n resilience-platform
          kubectl set image deployment/resilience-platform-deployment fastapi-container=ghcr.io/${{ github.repository }}:${{ needs.build-and-publish.outputs.sha_tag }} -n resilience-platform
          kubectl rollout status deployment/resilience-platform-deployment -n resilience-platform

      - name: Run Performance/Load Tests (Locust Smoke)
        run: |
          pip install locust
          locust -f tests/locustfile.py --headless -u 10 -r 2 --run-time 1m --host=http://resilience-platform-service.resilience-platform.svc.cluster.local      

  deploy-production:
    needs: [build-and-publish, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig Access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBERNETES_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Canary Deployment to Production
        id: deploy
        run: |
          kubectl apply -f k8s/ -n resilience-prod
          kubectl set image deployment/resilience-platform-deployment fastapi-container=ghcr.io/${{ github.repository }}:${{ needs.build-and-publish.outputs.sha_tag }} -n resilience-prod
          
      - name: Automatic Rollback on Failure
        if: failure()
        run: |
          echo "Production deployment failed! Starting automatic rollback..."
          kubectl rollout undo deployment/resilience-platform-deployment -n resilience-prod
          
      - name: Send Notification to Telegram/Slack
        if: always()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"Deployment status: ${{ job.status }}"}' ${{ secrets.NOTIFICATIONS_WEBHOOK }}