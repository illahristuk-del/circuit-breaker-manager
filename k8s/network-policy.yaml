apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-traffic
  namespace: resilience-platform
spec:
  podSelector:
    matchLabels:
      app: resilience-pod
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ingress-controller 
    ports:
    - protocol: TCP
      port: 8000