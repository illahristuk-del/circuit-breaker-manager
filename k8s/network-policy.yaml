apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resilience-policy
  namespace: resilience-platform
spec:
  podSelector:
    matchLabels:
      app: resilience-platform 
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: resilience-platform
    ports:
    - protocol: TCP
      port: 8000
